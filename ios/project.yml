name: LocalSync
options:
  bundleIdPrefix: com.localsync
  deploymentTarget:
    iOS: 16.0
targets:
  LocalSync:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: LocalSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.localsync.LocalSync
        PRODUCT_NAME: LocalSync
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: LocalSync/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
    frameworks:
      - framework: Photos.framework
      - framework: AVFoundation.framework
      - framework: AVKit.framework
      - framework: Network.framework
      - framework: CryptoKit.framework
      - framework: BackgroundTasks.framework
      - sdk: libsqlite3.tbd
